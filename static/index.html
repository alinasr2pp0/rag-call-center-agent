<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد خدمة العملاء</title>
<style>
  :root {
    --bg: #F6F4F0;
    --panel: #FFFFFF;
    --ink: #1E2A28;
    --muted: #6B7674;
    --line: #E4E0D8;
    --accent: #1F5C52;
    --accent-soft: #E4EFEC;
    --agent-bubble: #EDEAE2;
    --customer-bubble: #1F5C52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 85vh;
  }
  header {
    padding: 4px 4px 18px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }
  .panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .status-bar {
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 20px;
  }
  .pill {
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .msg.customer {
    align-self: flex-end;
    background: var(--customer-bubble);
    color: #fff;
    border-bottom-left-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--agent-bubble);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 12.5px;
    padding: 2px 8px;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    background: var(--bg);
  }
  .composer input:focus { border-color: var(--accent); }
  .composer button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .intro-form {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
  }
  .intro-form input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--bg);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>مساعد خدمة العملاء</h1>
    <p>اكتب مشكلتك وسيحاول المساعد حلها فورًا من قاعدة المعرفة</p>
    <p id="modeNote" style="margin-top:6px;font-size:12px;color:var(--muted)"></p>
  </header>
  <div class="panel">
    <div class="intro-form">
      <input id="phone" placeholder="رقم الهاتف" value="+201000000000">
      <input id="name" placeholder="الاسم (اختياري)">
    </div>
    <div class="status-bar" id="statusBar"></div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" placeholder="اكتب مشكلتك هنا..." autocomplete="off">
      <button id="send">إرسال</button>
    </div>
  </div>
</div>

<script>
const API_BASE = ""; // same origin as the FastAPI app
const messagesEl = document.getElementById("messages");
const statusBar = document.getElementById("statusBar");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const phoneInput = document.getElementById("phone");
const nameInput = document.getElementById("name");

let ticketId = null;
let pollTimer = null;
let demoMode = false; // flips to true automatically if the real API isn't reachable

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setStatus(html) {
  statusBar.innerHTML = html;
}

const OUTCOME_LABEL = {
  resolved_confirmed: { text: "تم تأكيد الحل ✓", cls: "ok" },
  transferred_to_agent: { text: "تم التحويل لموظف بشري", cls: "warn" },
  still_unresolved: { text: "جاري إعادة المحاولة...", cls: "" },
};

async function sendProblem(text) {
  addMessage(text, "customer");
  input.value = "";
  sendBtn.disabled = true;
  setStatus('<span>جاري البحث عن حل...</span>');
  clearInterval(pollTimer);

  let data;
  try {
    const res = await fetch(`${API_BASE}/tickets/message`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        customer_phone: phoneInput.value || "+201000000000",
        customer_name: nameInput.value || null,
        problem_text: text
      })
    });
    if (!res.ok) throw new Error("request failed");
    data = await res.json();
    demoMode = false;
  } catch (err) {
    demoMode = true;
    data = simulateFirstAnswer(text);
  }

  ticketId = data.ticket_id;
  document.getElementById("modeNote").textContent = demoMode
    ? "⚠ لا يوجد اتصال بالسيرفر الحقيقي — يعمل الآن بعرض تجريبي محاكى"
    : "متصل بالسيرفر الحقيقي";
  addMessage(data.answer || "معلش، مش لاقي حل مناسب دلوقتي، هيتم التواصل معاك.", "agent");

  const sourceLabel = { kb: "قاعدة المعرفة", web_search: "بحث إنترنت", none: "بدون مصدر" }[data.source] || data.source;
  setStatus(`
    <span class="pill">المصدر: ${sourceLabel}</span>
    <span class="pill">الثقة: ${Math.round((data.confidence || 0) * 100)}%</span>
    <span class="pill" id="callPill">في انتظار مكالمة التأكيد</span>
  `);
  addMessage(`سيتم الاتصال بك خلال ${Math.round(data.followup_call_in_seconds / 60)} دقائق للتأكد من حل المشكلة`, "system");

  sendBtn.disabled = false;
  startPolling();
}

function startPolling() {
  pollTimer = setInterval(async () => {
    let status;
    if (demoMode) {
      status = simulateStatusTick();
    } else {
      try {
        const res = await fetch(`${API_BASE}/tickets/${ticketId}/status`);
        status = await res.json();
      } catch {
        return;
      }
    }
    renderCallStatus(status);
  }, demoMode ? 2500 : 5000);
}

function renderCallStatus(status) {
  const pill = document.getElementById("callPill");
  const call = status.latest_call;
  if (!call) return;

  if (call.status === "in_progress" && pill) {
    pill.textContent = "المكالمة جارية الآن...";
  }

  if (call.status === "completed" && call.outcome) {
    const label = OUTCOME_LABEL[call.outcome] || { text: call.outcome, cls: "" };
    if (pill) pill.textContent = label.text;

    if (call.outcome === "resolved_confirmed") {
      addMessage("تم التأكيد أثناء المكالمة: المشكلة اتحلت. تم إغلاق التذكرة.", "system");
      clearInterval(pollTimer);
    } else if (call.outcome === "transferred_to_agent") {
      addMessage("لم تُحل المشكلة عبر القنوات الآلية، تم تحويلها لموظف بشري.", "system");
      clearInterval(pollTimer);
    } else if (call.outcome === "still_unresolved") {
      addMessage(`جاري تجربة حل آخر (المحاولة ${status.resolution_attempts})...`, "system");
    }
  }
}

// ---- Demo simulation (used only when no live backend is reachable) ----
let demoTick = 0;
function simulateFirstAnswer(text) {
  return {
    ticket_id: "demo-" + Math.random().toString(36).slice(2, 8),
    answer: "بناءً على قاعدة المعرفة، جرّب تتحقق من تفاصيل الفاتورة من التطبيق أولًا، غالبًا الفرق بيكون بسبب تجاوز الباقة.",
    confidence: 0.82,
    source: "kb",
    followup_call_in_seconds: 180,
  };
}
function simulateStatusTick() {
  demoTick += 1;
  if (demoTick === 1) return { resolution_attempts: 1, latest_call: { status: "in_progress", outcome: null } };
  if (demoTick === 2) return { resolution_attempts: 1, latest_call: { status: "completed", outcome: "still_unresolved" } };
  if (demoTick === 3) return { resolution_attempts: 2, latest_call: { status: "in_progress", outcome: null } };
  return { resolution_attempts: 2, latest_call: { status: "completed", outcome: "resolved_confirmed" } };
}

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) sendProblem(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = input.value.trim();
    if (text) sendProblem(text);
  }
});
</script>
</body>
</html>
